name: CI

on:
  push:
    branches: [master, preview]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Generates the route types that `bun check` needs on a fresh checkout.
      - run: bunx next typegen
      - run: bun fmt --check
      - run: bun run lint
      - run: bun check
